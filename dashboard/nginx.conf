server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without this, nginx serves text/html with no charset parameter and the
    # browser is left to guess encoding for the page's UTF-8 punctuation
    # (em dashes, middots, checkmarks) - it guessed wrong here and rendered
    # every one of them as mojibake. index.html also declares <meta
    # charset="UTF-8"> itself; this is the belt-and-braces server-side half.
    charset utf-8;

    # The terminal polls the verifier at :8001 directly (CORS is enabled there).
    # Serving the page with no-cache keeps a redeployed dashboard from being
    # pinned to a stale build in the browser.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
