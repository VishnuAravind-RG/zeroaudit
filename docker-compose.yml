# ZEROAUDIT - full stack
#
# Key material comes from .env (see .env.example). Generate a real one with:
#     python -m scripts.gen_keys > .env
#
# Without those keys each container mints ephemeral ones at boot, which means
# a restarted prover can no longer open any commitment it published earlier
# and the verifier rejects every signature. Fine for a smoke test, useless
# for a ledger.

services:

  # -- Apache Cassandra (append-only commitment ledger) ----------------------
  cassandra:
    image: cassandra:4.1
    container_name: zeroaudit-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: zeroaudit-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    volumes:
      - cassandra_data:/var/lib/cassandra
    # NOTE: the schema is applied by the prover at startup, not by mounting a
    # .cql file into /docker-entrypoint-initdb.d. That directory is a Postgres
    # and MySQL convention; the Cassandra image does not execute anything in
    # it, so the previous mount silently did nothing and the keyspace never
    # existed.
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # -- Zookeeper ------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zeroaudit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    # cp-zookeeper 7.6's default 4lw.commands.whitelist only enables `srvr` -
    # `ruok` is disabled out of the box, and this image's configure script
    # does not map ZOOKEEPER_4LW_COMMANDS_WHITELIST into zookeeper.properties
    # at all (confirmed: the property never appears in the rendered config).
    # `srvr` is always on and its "Mode: standalone" line is just as good a
    # liveness signal, so the healthcheck uses that instead of fighting the
    # whitelist.
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -- Kafka ----------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: zeroaudit-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  # -- Topic bootstrap ------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: zeroaudit-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    volumes:
      - ./services/kafka/create_topics.sh:/scripts/create_topics.sh:ro
    restart: "no"

  # -- Neo4j (real sanctions-screening graph) --------------------------------
  # Replaces the earlier hash-prefix "sanctions proximity" heuristic. Loaded
  # by sanctions-init with the actual U.S. Treasury OFAC SDN list - see
  # scripts/load_sanctions_graph.py for what goes in and
  # verifier/sanctions_graph.py for the real Cypher query that reads it back.
  neo4j:
    image: neo4j:5-community
    container_name: zeroaudit-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-zeroaudit-demo}
      NEO4J_PLUGINS: "[]"
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7687:7687"   # bolt - queried by the prover
      - "7474:7474"   # browser UI - open it to inspect the real graph
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # -- Sanctions graph loader (one-shot: real OFAC SDN list -> Neo4j) -------
  sanctions-init:
    build:
      context: .
      dockerfile: Dockerfile.sanctions-init
    container_name: zeroaudit-sanctions-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-zeroaudit-demo}
    restart: "no"

  # -- Prover (enclave side: holds every secret, sees every amount) ---------
  prover:
    build:
      context: .
      dockerfile: Dockerfile.prover
    container_name: zeroaudit-prover
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      sanctions-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE: zeroaudit
      CASSANDRA_ENABLED: "true"
      ONNX_MODEL_PATH: /app/models/intent_autoencoder_fp16.onnx
      ANOMALY_THRESHOLD: "0.75"
      INGRESS_REQUIRE_SIGNATURE: "false"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-zeroaudit-demo}
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      # Deterministic key material - see .env.example
      ZEROAUDIT_MASTER_KEY: ${ZEROAUDIT_MASTER_KEY:-}
      LWE_SEED_HEX: ${LWE_SEED_HEX:-}
      SGX_SIGNING_KEY_B64: ${SGX_SIGNING_KEY_B64:-}
      # Mutual TLS for the /keys exchange - see scripts/gen_tls_certs.py.
      # Optional: unset (or an absent ./certs dir) falls back to plain HTTP,
      # same as before.
      TLS_CERT_FILE: /certs/prover.crt
      TLS_KEY_FILE: /certs/prover.key
      TLS_CA_FILE: /certs/ca.crt
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      # The whole listener requires a client certificate once TLS_CA_FILE is
      # set, so the healthcheck must present one too. All demo certs are
      # generated together into one local ./certs/ directory and bind-mounted
      # read-only here - a real multi-host deployment would give this
      # container only its own identity, not the verifier's.
      test: ["CMD-SHELL", "python -c \"import ssl,urllib.request; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.load_verify_locations('/certs/ca.crt'); ctx.load_cert_chain('/certs/verifier.crt','/certs/verifier.key'); urllib.request.urlopen('https://localhost:8000/health', context=ctx, timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # Real SGX hardware isn't available to run this on, so the "enclave"
    # boundary can't be hardware-attested - but the isolation AROUND it can
    # still be genuinely enforced rather than left at Docker's defaults,
    # which grant a broad Linux capability set and a writable root fs to a
    # container holding the master key, the lattice secret, and the signing
    # key. cap_drop removes every capability the prover doesn't use (it
    # binds a single unprivileged port and makes outbound connections - it
    # never needs raw sockets, ptrace, or anything else in the default set).
    # read_only plus a tmpfs for /tmp means a remote code execution bug has
    # nowhere on disk to drop a payload.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # -- Verifier (external DMZ: public keys only, never an amount) -----------
  verifier:
    build:
      context: .
      dockerfile: Dockerfile.verifier
    container_name: zeroaudit-verifier
    depends_on:
      kafka:
        condition: service_healthy
      prover:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      PROVER_URL: https://prover:8000
      VERIFIER_PORT: "8001"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      LOG_LEVEL: INFO
      # Mutual TLS to reach the prover - see scripts/gen_tls_certs.py. The
      # verifier presents this client cert; the prover checks it against
      # the same CA before it will even complete the handshake.
      TLS_VERIFIER_CERT_FILE: /certs/verifier.crt
      TLS_VERIFIER_KEY_FILE: /certs/verifier.key
      TLS_CA_FILE: /certs/ca.crt
      # Deliberately absent: no master key, no lattice seed, no signing key.
      # The verifier fetches PUBLIC keys from the prover at startup.
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # -- Bank simulator -------------------------------------------------------
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: zeroaudit-simulator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_INGEST: zeroaudit.transactions.raw
      SIM_TPS: "15"
      SIM_ANOMALY_RATE: "0.05"
      LOG_LEVEL: INFO
    restart: unless-stopped

  # -- Audit terminal -------------------------------------------------------
  dashboard:
    build: ./dashboard
    container_name: zeroaudit-dashboard
    ports:
      - "3000:80"
    depends_on:
      verifier:
        condition: service_healthy

volumes:
  cassandra_data:
  neo4j_data:
